name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TASK_VERSION: 3.53.1

defaults:
  run:
    shell: bash

# Cancel obsolete PR runs.
# Main runs stay independent so every successful commit can become a release.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: ${{ env.TASK_VERSION }}

      - name: Verify
        run: task verify:ci

  container-check:
    name: Verify container build
    needs:
      - verify
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        with:
          pull: true
          push: false
          platforms: linux/amd64
          cache-from: |
            type=gha,scope=container-main
            type=gha,scope=container-pr-${{ github.event.pull_request.number }}
          cache-to: type=gha,mode=max,scope=container-pr-${{ github.event.pull_request.number }},ignore-error=true
          provenance: false
          sbom: false

  publish:
    name: Publish container
    needs:
      - verify
    if: github.event_name == 'push'

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and publish container
        uses: docker/build-push-action@v7
        with:
          pull: true
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-main
          cache-to: type=gha,mode=max,scope=container-main,ignore-error=true
          provenance: mode=max
          sbom: true