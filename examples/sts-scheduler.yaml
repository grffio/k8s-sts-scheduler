---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sts-scheduler
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sts-scheduler-as-system-kube-scheduler
subjects:
  - kind: ServiceAccount
    name: sts-scheduler
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:kube-scheduler

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sts-scheduler-as-system-volume-scheduler
subjects:
  - kind: ServiceAccount
    name: sts-scheduler
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sts-scheduler-extension-apiserver-authentication-reader
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: sts-scheduler
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sts-scheduler-election
  namespace: kube-system
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    resourceNames:
      - sts-scheduler
    verbs:
      - get
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sts-scheduler-election
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: sts-scheduler
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sts-scheduler-election

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sts-scheduler
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: sts-scheduler
      component: scheduler

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sts-scheduler
  namespace: kube-system
  labels:
    app: sts-scheduler
    component: scheduler
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: sts-scheduler
      component: scheduler
  template:
    metadata:
      labels:
        app: sts-scheduler
        component: scheduler
    spec:
      serviceAccountName: sts-scheduler
      priorityClassName: system-cluster-critical
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: sts-scheduler
                    component: scheduler
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sts-scheduler
          image: ghcr.io/grffio/k8s-sts-scheduler:latest
          imagePullPolicy: IfNotPresent
          args:
            - --config=/configs/config.yaml
          ports:
            - name: https
              containerPort: 10259
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: sts-scheduler-config
              mountPath: /configs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          terminationMessagePolicy: FallbackToLogsOnError
      volumes:
        - name: sts-scheduler-config
          configMap:
            name: sts-scheduler-config
